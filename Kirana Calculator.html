<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kirana Calculator</title>
<meta name="theme-color" content="#14532d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Maal Hisaab">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2314532d'/%3E%3Ctext x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%2314532d'/%3E%3Ctext x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' fill='%23fbbf24' font-family='sans-serif'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f1; --card:#ffffff; --ink:#10261a; --muted:#5b6f63;
  --green:#14532d; --green-ink:#ffffff; --sun:#fbbf24; --sun-ink:#3b2a00;
  --line:#cfdccf; --result:#14532d; --result-ink:#ffffff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1a13; --card:#16271c; --ink:#f1f7f2; --muted:#9fb4a6;
    --green:#fbbf24; --green-ink:#3b2a00; --sun:#fbbf24; --sun-ink:#3b2a00;
    --line:#2b4233; --result:#fbbf24; --result-ink:#3b2a00;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1a13; --card:#16271c; --ink:#f1f7f2; --muted:#9fb4a6;
  --green:#fbbf24; --green-ink:#3b2a00; --sun:#fbbf24; --sun-ink:#3b2a00;
  --line:#2b4233; --result:#fbbf24; --result-ink:#3b2a00;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:"Baloo 2",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  min-height:100vh;
}
.wrap{max-width:480px;margin:0 auto;padding:14px 14px 28px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 12px}
h1{font-size:22px;margin:0;font-weight:800;line-height:1.1}
.install{
  flex:none;border:0;border-radius:14px;height:48px;padding:0 14px;font:inherit;font-weight:800;
  font-size:16px;background:var(--sun);color:var(--sun-ink);cursor:pointer;line-height:1
}
.install:active{transform:scale(.97)}
.install:focus-visible,.sheet button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .box{
  width:100%;max-width:480px;background:var(--card);color:var(--ink);border-radius:24px 24px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))
}
.sheet h2{margin:0 0 10px;font-size:22px;font-weight:800}
.sheet ol{margin:0 0 16px;padding-left:22px;font-size:18px;font-weight:500;line-height:1.5}
.sheet button{width:100%;height:56px;border:0;border-radius:16px;font:inherit;font-weight:800;font-size:19px;
  background:var(--green);color:var(--green-ink);cursor:pointer}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--line);padding:6px;border-radius:18px}
.tab{
  border:0;border-radius:13px;padding:14px 6px;font:inherit;font-weight:800;font-size:19px;
  background:transparent;color:var(--muted);cursor:pointer;line-height:1.15
}
.tab small{display:block;font-size:13px;font-weight:500}
.tab[aria-selected="true"]{background:var(--green);color:var(--green-ink)}
.tab:focus-visible,input:focus-visible,.clear:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.card{background:var(--card);border-radius:20px;padding:16px;margin-top:14px;border:2px solid var(--line)}
label{display:block;font-weight:700;font-size:18px;margin:0 0 6px}
label span{color:var(--muted);font-weight:500;font-size:15px}
.field{position:relative;margin-bottom:16px}
.field:last-child{margin-bottom:0}
input{
  width:100%;font:inherit;font-weight:800;font-size:34px;padding:8px 64px 8px 16px;
  height:68px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink)
}
input:focus{border-color:var(--green)}
.unit{position:absolute;right:16px;bottom:0;height:68px;display:flex;align-items:center;
  font-weight:700;font-size:20px;color:var(--muted);pointer-events:none}
.result{
  margin-top:14px;border-radius:20px;padding:18px 16px;text-align:center;
  background:var(--result);color:var(--result-ink);min-height:148px;
  display:flex;flex-direction:column;justify-content:center
}
.result .lbl{font-size:19px;font-weight:700;opacity:.9}
.result .val{font-size:68px;font-weight:800;line-height:1.05;word-break:break-all}
.result .sub{font-size:17px;font-weight:500;opacity:.85;min-height:24px}
.result.empty .val{opacity:.35}
.clear{
  margin-top:14px;width:100%;height:60px;border:0;border-radius:16px;font:inherit;
  font-weight:800;font-size:20px;background:var(--sun);color:var(--sun-ink);cursor:pointer
}
.clear:active{transform:scale(.98)}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Maal ka Hisaab</h1>
    <button class="install" id="install" hidden>📲 App Install</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="box" role="dialog" aria-labelledby="sheetTitle">
      <h2 id="sheetTitle">Phone mein App banao</h2>
      <ol id="steps"></ol>
      <button id="sheetOk">Theek hai</button>
    </div>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="t1" aria-selected="true">Gram → ₹<small>Kitne paise?</small></button>
    <button class="tab" role="tab" id="t2" aria-selected="false">₹ → Gram<small>Kitna maal?</small></button>
  </div>

  <div class="card">
    <div class="field">
      <label for="rate">Rate <span>(₹ per kilo)</span></label>
      <input id="rate" type="text" inputmode="decimal" autocomplete="off" placeholder="60">
      <div class="unit">₹/kg</div>
    </div>
    <div class="field" id="f1">
      <label for="grams">Kitna maal <span>(gram mein)</span></label>
      <input id="grams" type="text" inputmode="decimal" autocomplete="off" placeholder="350">
      <div class="unit">gram</div>
    </div>
    <div class="field" id="f2" hidden>
      <label for="money">Customer ke paise <span>(₹ mein)</span></label>
      <input id="money" type="text" inputmode="decimal" autocomplete="off" placeholder="20">
      <div class="unit">₹</div>
    </div>
  </div>

  <div class="result empty" id="res" aria-live="polite">
    <div class="lbl" id="lbl">Paise dene hain</div>
    <div class="val" id="val">₹ 0</div>
    <div class="sub" id="sub"></div>
  </div>

  <button class="clear" id="clr">Saaf karo (Clear)</button>
</div>

<script>
(function(){
  var mode = 1;
  var $ = function(id){return document.getElementById(id)};
  var rate=$("rate"), grams=$("grams"), money=$("money");

  try{ var saved = localStorage.getItem("kirana-rate"); if(saved) rate.value = saved; }catch(e){}

  function num(el){
    var v = parseFloat(String(el.value).replace(",", "."));
    return isFinite(v) && v > 0 ? v : 0;
  }
  function clean(el){
    el.value = el.value.replace(/[^0-9.,]/g, "");
  }
  function fmtRs(x){
    var r = Math.round(x * 100) / 100;
    return Number.isInteger(r) ? String(r) : r.toFixed(2);
  }
  function fmtG(x){
    var g = Math.round(x);
    if(g >= 1000){
      var kg = g / 1000;
      return {main: g + " g", sub: (Math.round(kg*1000)/1000) + " kilo"};
    }
    return {main: g + " g", sub: ""};
  }

  function calc(){
    var r = num(rate);
    var res = $("res");
    if(mode === 1){
      $("lbl").textContent = "Paise dene hain";
      var g = num(grams);
      if(r && g){
        var rs = r * g / 1000;
        $("val").textContent = "₹ " + fmtRs(rs);
        $("sub").textContent = g + " g × ₹" + r + "/kg";
        res.classList.remove("empty");
      }else{
        $("val").textContent = "₹ 0"; $("sub").textContent = ""; res.classList.add("empty");
      }
    }else{
      $("lbl").textContent = "Maal dena hai";
      var m = num(money);
      if(r && m){
        var out = fmtG(m / r * 1000);
        $("val").textContent = out.main;
        $("sub").textContent = out.sub || ("₹" + m + " ÷ ₹" + r + "/kg");
        res.classList.remove("empty");
      }else{
        $("val").textContent = "0 g"; $("sub").textContent = ""; res.classList.add("empty");
      }
    }
  }

  function setMode(m){
    mode = m;
    $("t1").setAttribute("aria-selected", m === 1);
    $("t2").setAttribute("aria-selected", m === 2);
    $("f1").hidden = m !== 1;
    $("f2").hidden = m !== 2;
    calc();
    (m === 1 ? grams : money).focus();
  }

  $("t1").onclick = function(){ setMode(1); };
  $("t2").onclick = function(){ setMode(2); };

  [rate, grams, money].forEach(function(el){
    el.addEventListener("input", function(){
      clean(el);
      if(el === rate){ try{ localStorage.setItem("kirana-rate", rate.value); }catch(e){} }
      calc();
    });
  });

  // Clear only the quantity/amount; keep the rate for the next customer
  $("clr").onclick = function(){
    grams.value = ""; money.value = "";
    calc();
    (mode === 1 ? grams : money).focus();
  };

  calc();

  // ---- App install ----
  var installBtn = $("install"), sheet = $("sheet"), deferred = null;
  var standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone;

  // Best-effort web app manifest so Chrome/Android can offer a real install
  try{
    var icon = "data:image/svg+xml," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#14532d'/>" +
      "<text x='50' y='72' font-size='62' font-weight='bold' text-anchor='middle' fill='#fbbf24' font-family='sans-serif'>\u20B9</text></svg>");
    var manifest = {
      name: "Maal ka Hisaab", short_name: "Maal Hisaab", display: "standalone",
      start_url: location.href, scope: location.href,
      background_color: "#f3f7f1", theme_color: "#14532d",
      icons: [{src: icon, sizes: "any", type: "image/svg+xml", purpose: "any"}]
    };
    var link = document.createElement("link");
    link.rel = "manifest";
    link.href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], {type: "application/manifest+json"}));
    document.head.appendChild(link);
  }catch(e){}

  if(!standalone) installBtn.hidden = false;

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault();
    deferred = e;
  });
  window.addEventListener("appinstalled", function(){
    installBtn.hidden = true; deferred = null;
  });

  function showHelp(){
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/i.test(ua);
    var steps = ios
      ? ["Safari mein ye page kholo", "Neeche <b>Share</b> button (⬆️) dabao", "<b>Add to Home Screen</b> chuno", "<b>Add</b> dabao. Ho gaya!"]
      : ["Chrome mein ye page kholo", "Upar kone mein <b>⋮</b> (teen dot) dabao", "<b>Add to Home screen</b> ya <b>Install app</b> chuno", "<b>Install</b> dabao. Ho gaya!"];
    $("steps").innerHTML = steps.map(function(s){return "<li>" + s + "</li>"}).join("");
    sheet.hidden = false;
    $("sheetOk").focus();
  }

  installBtn.onclick = function(){
    if(deferred){
      deferred.prompt();
      deferred.userChoice.then(function(){ deferred = null; });
    }else{
      showHelp();
    }
  };
  $("sheetOk").onclick = function(){ sheet.hidden = true; };
  sheet.addEventListener("click", function(e){ if(e.target === sheet) sheet.hidden = true; });
})();
</script>
</body>
</html>
